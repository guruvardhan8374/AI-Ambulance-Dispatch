services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ambulance_backend
    expose:
      - "8000"
    volumes:
      - backend_data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-insecure-secret-key-change-in-production-2026}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/sql_app.db}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80,http://127.0.0.1}
      - TOKEN_EXPIRE_MINUTES=${TOKEN_EXPIRE_MINUTES:-10080}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ambulance-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ambulance_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ambulance-network

networks:
  ambulance-network:
    driver: bridge

volumes:
  backend_data:
    driver: local

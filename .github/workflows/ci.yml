name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug - list backend folder
        run: |
          echo "Repo root contents:"
          ls -la
          echo "Backend folder contents:"
          ls -la backend || echo "backend folder not found"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Lint backend (Flake8)
        run: |
          cd backend
          pip install flake8
          flake8 . || true

      - name: Security scan (Bandit)
        run: |
          cd backend
          pip install bandit
          bandit -r . || true

      - name: Run backend tests (pytest)
        run: |
          cd backend
          pip install pytest pytest-cov
          pytest --cov=. || true

      - name: Build backend Docker image
        run: |
          if [ -f backend/Dockerfile ]; then
            docker build -t responsai-backend ./backend
          else
            echo "No Dockerfile found in backend/, skipping Docker build."
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Lint frontend (ESLint)
        run: |
          cd frontend
          npm run lint || true

      - name: Security audit (npm audit)
        run: |
          cd frontend
          npm audit --audit-level=high || true

      - name: Run frontend tests (Jest)
        run: |
          cd frontend
          npm test -- --coverage || true

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Build frontend Docker image
        run: |
          if [ -f frontend/Dockerfile ]; then
            docker build -t responsai-frontend ./frontend
          else
            echo "No Dockerfile found in frontend/, skipping Docker build."
          fi

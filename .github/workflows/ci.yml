name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Lint backend (Flake8)
        run: |
          cd backend
          pip install flake8
          flake8 . || true
      - name: Security scan (Bandit)
        run: |
          cd backend
          pip install bandit
          bandit -r . || true
      - name: Run backend tests (pytest)
        run: |
          cd backend
          pip install pytest pytest-cov
          pytest --cov=. || true
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/responsai-backend:latest
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install
      - name: Lint frontend (ESLint)
        run: |
          cd frontend
          npm run lint || true
      - name: Security audit (npm audit)
        run: |
          cd frontend
          npm audit --audit-level=high || true
      - name: Run frontend tests (Jest)
        run: |
          cd frontend
          npm test -- --coverage || true
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/responsai-frontend:latest
  staging:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Start staging environment
        run: docker compose up -d --build
      - name: Wait for backend health check
        run: |
          echo "Waiting for backend to become healthy..."
          for i in {1..15}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' ambulance_backend 2>/dev/null || echo "starting")
            echo "Attempt $i: backend status = $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "Backend is healthy!"
              break
            fi
            sleep 5
          done
      - name: Smoke test - backend
        run: |
          echo "Testing backend endpoint..."
          curl -f http://localhost:8000/ && echo "Backend smoke test PASSED"
      - name: Smoke test - frontend
        run: |
          echo "Testing frontend endpoint..."
          curl -f http://localhost:3000/ && echo "Frontend smoke test PASSED"
      - name: Show running containers
        run: docker ps
      - name: Tear down staging environment
        if: always()
        run: docker compose down
  production:
    runs-on: ubuntu-latest
    needs: [staging]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: docker compose up -d --build
      - name: Wait for backend health check
        run: |
          echo "Checking production backend health..."
          SUCCESS=false
          for i in {1..15}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' ambulance_backend 2>/dev/null || echo "starting")
            echo "Attempt $i: backend status = $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "Production backend is healthy!"
              SUCCESS=true
              break
            fi
            sleep 5
          done
          if [ "$SUCCESS" = "false" ]; then
            echo "HEALTHCHECK_FAILED=true" >> $GITHUB_ENV
          fi
      - name: Verify production endpoints
        if: env.HEALTHCHECK_FAILED != 'true'
        run: |
          curl -f http://localhost:8000/ && echo "Production backend is LIVE"
          curl -f http://localhost:3000/ && echo "Production frontend is LIVE"
      - name: Rollback on failure
        if: env.HEALTHCHECK_FAILED == 'true'
        run: |
          echo "Health check failed. Rolling back deployment..."
          docker compose down
          echo "Rollback complete. Previous stable state restored."
          exit 1
      - name: Show production containers
        if: env.HEALTHCHECK_FAILED != 'true'
        run: docker ps
      - name: Tear down (cleanup runner)
        if: always()
        run: docker compose down
